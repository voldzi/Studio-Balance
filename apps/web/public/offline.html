<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#B56E4F" />
    <title>Studio Balance – bez připojení</title>
    <style>
      body { align-items: center; background: #f7f3ee; color: #3e332d; display: flex; font-family: Arial, sans-serif; justify-content: center; margin: 0; min-height: 100vh; padding: 24px; text-align: center; }
      main { max-width: 34rem; }
      h1 { font-family: Georgia, serif; font-size: clamp(2rem, 8vw, 3rem); margin: 0 0 1rem; }
      p { font-size: 1.125rem; line-height: 1.6; }
      button { background: #b56e4f; border: 0; border-radius: 0.75rem; color: white; cursor: pointer; font: inherit; font-weight: 700; margin-top: 1rem; min-height: 48px; padding: 0.75rem 1.25rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Jsi bez připojení</h1>
      <p>Pro aktuální rozvrh a rezervaci je potřeba internetové připojení. Až budeš online, stránku stačí znovu načíst.</p>
      <button type="button" onclick="window.location.reload()">Zkusit znovu</button>
    </main>
  </body>
</html>
