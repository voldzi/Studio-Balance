name: Repository contract

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: studio_balance_ci
          POSTGRES_USER: studio_ci
          POSTGRES_PASSWORD: ci-disposable-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studio_ci -d studio_balance_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.26.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit dependencies (including development tools)
        run: node scripts/audit-dependencies.mjs
      - name: Lint, typecheck, test, build and validate contracts
        run: pnpm check
      - name: Mandatory isolated PostgreSQL integration tests
        env:
          STUDIO_TEST_DATABASE_URL: postgresql://studio_ci:ci-disposable-only@127.0.0.1:5432/studio_balance_ci
        run: node scripts/test-database-integration.mjs
      - name: Validate preview Compose contract
        env:
          POSTGRES_PASSWORD: ci-preview-only
        run: APP_VERSION=${{ github.sha }} docker compose -f docker-compose.preview.yml config --quiet
      - name: Build production container targets
        run: |
          docker build --target web-runtime --tag studiobalance/web:${{ github.sha }} .
          docker build --target api-runtime --tag studiobalance/api:${{ github.sha }} .
          docker build --target worker-runtime --tag studiobalance/worker:${{ github.sha }} .
      - name: Scan web runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: studiobalance/web:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 1
          vuln-type: os,library
      - name: Scan API runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: studiobalance/api:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 1
          vuln-type: os,library
      - name: Scan worker runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: studiobalance/worker:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 1
          vuln-type: os,library
